name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hcms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hcms_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, intl, zip, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # public/build tidak masuk git; halaman ber-@vite butuh manifest hasil build
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      # Kode Sximo lama belum mengikuti Pint; gaya hanya ditegakkan untuk kode baru HCMS
      - name: Pint (kode baru)
        run: vendor/bin/pint --test app/Domain app/Support app/Models/Tenant.php app/Http/Middleware/SetTenantContext.php app/Http/Controllers/Core/TenantsController.php tests/Unit/Tenancy tests/Feature/Tenancy tests/Concerns app/Support/Security app/Domain/Security app/Domain/Organization app/Http/Controllers/Core/DataScopesController.php tests/Feature/Security database/seeders/RolesSeeder.php
      - run: php artisan migrate --force
      - run: vendor/bin/phpunit

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer audit --locked --no-interaction
